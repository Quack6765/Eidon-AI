name: Docker Build

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Debounce rapid dev pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: sleep 300

      - uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set dev build version
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: echo "DEV_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Detect deployment-sensitive changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deployment:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker.yml'
              - '.github/workflows/test.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'public/**'
              - 'server.cjs'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build full production image (release)
        if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}:latest
            ghcr.io/${{ env.REPO_LOWERCASE }}:${{ github.event.release.tag_name }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main,mode=max

      - name: Publish Mobile API v1 release contracts
        if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          contracts/mobile-api-v1.openapi.json
          contracts/mobile-api-v1.websocket.schema.json
          --clobber

      - name: Build full production image (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.DEV_VERSION }}
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}:dev
            ghcr.io/${{ env.REPO_LOWERCASE }}:${{ env.DEV_VERSION }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:dev
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:dev,mode=max

      - name: Build full production image (pull request)
        if: github.event_name == 'pull_request' && steps.changes.outputs.deployment == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ghcr.io/${{ env.REPO_LOWERCASE }}:pr
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main,mode=max

      - name: Build lightweight builder image
        if: github.event_name == 'pull_request' && steps.changes.outputs.deployment != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: false
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ env.REPO_LOWERCASE }}/buildcache:main,mode=max
