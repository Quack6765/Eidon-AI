name: Test

on:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: docker compose -f docker-compose.native-test.yml config

      - run: npm test

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Upload Mobile API v1 contracts
        uses: actions/upload-artifact@v4
        with:
          name: eidon-mobile-api-v1-contracts
          path: |
            contracts/mobile-api-v1.openapi.json
            contracts/mobile-api-v1.websocket.schema.json
