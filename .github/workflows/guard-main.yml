name: Guard Main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        if: github.event.pull_request.head.ref != 'dev'
        run: |
          echo "::error::Pull requests into main must come from the dev branch (this one is from '${{ github.event.pull_request.head.ref }}'). Merge into dev first, then open a PR from dev to main."
          exit 1
